# Podman inside the dev container (the hub runs its agents and jobs there). There is no
# systemd here and /sys/fs/cgroup is read-only, so containers run without
# cgroups and events go to a file.
[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"

[containers]
cgroups = "disabled"

[network]
network_backend = "netavark"

version = 1
description = "Reviews proposed monorepo changes against policies/reviewer.md. Spawned fresh per proposal."
kind = "ephemeral"
image = "agent"
workspace = "none"
# Default network: the reviewer calls its model over the network, so "none" would leave it unable
# to work. It holds no secrets beyond the model key and has no web tools.
capabilities = ["review"]
idle_timeout = "10m"

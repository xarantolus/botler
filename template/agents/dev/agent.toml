version = 1
description = "General-purpose developer agent for building jobs, tools and connectors in the monorepo."
kind = "ephemeral"
image = "dev"
workspace = "monorepo"
idle_timeout = "30m"
# Every instance gets a persistent home at /home/agent ($HOME, the working directory) with its
# monorepo clone at ~/monorepo. Name a home to share it between agents working on one project:
# home = "groundstation"

[project]
name = "botler-monorepo"
version = "0.0.0"
# The agent and dev images' Python, so the gate needs no interpreter download.
requires-python = ">=3.11"

[tool.uv.workspace]
# Every job, tool package and connector is a workspace member, and the extras (tested, not run).
members = ["packages/*", "tools/*", "connectors/*", "jobs/*", "extras/*"]
# Jobs with no Python of their own.
exclude = ["jobs/browser"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "pyright>=1.1.390"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "RUF", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.pyright]
typeCheckingMode = "strict"
# The botler SDK is not a dependency: the hub mounts the copy matching its own version at
# /opt/botler/sdk in every container (agents, jobs, the gate) and puts it on PYTHONPATH.
# Packages that declare events or tools depend on pydantic themselves.
extraPaths = ["/opt/botler/sdk"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"

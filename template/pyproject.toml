[project]
name = "botler-monorepo"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv.workspace]
# Every job, tool package and connector is a workspace member.
members = ["packages/*", "tools/*", "connectors/*", "jobs/*"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "pyright>=1.1.390"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ANN", "RUF", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
addopts = "-q"

# Instance-wide settings. Protected: changes need the user's approval.
version = 1
timezone = "UTC"

[models]
default = "standard"

# Agents name a route, never a model. Routes carry their own token cap and privacy class.
[models.routes.standard]
provider = "openrouter"
model = "anthropic/claude-sonnet-latest"
api_key_secret = "OPENROUTER_API_KEY"
max_tokens = 16384

[models.routes.fast]
provider = "openrouter"
model = "anthropic/claude-haiku-latest"
api_key_secret = "OPENROUTER_API_KEY"
max_tokens = 8192

[defaults]
idle_timeout = "15m"
job_timeout = "10m"

[defaults.budget]
usd_per_day = 5.0

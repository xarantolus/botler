# Instance-wide settings. Protected: changes need the user's approval.
version = 1
# IANA time zone for schedules, agents' clocks and containers. Default: the host's.
# timezone = "Europe/Berlin"

[models]
# Agents run on OpenRouter (https://openrouter.ai/models). `default` and an agent's `model` take
# any OpenRouter model id; image input, output limit, context and price come from OpenRouter's
# model list. Defaults are deliberately cheap: an agent opts into a stronger model by naming it.
default = "deepseek/deepseek-v4.1-flash"
api_key_secret = "OPENROUTER_API_KEY"
# Output token cap per model call (lowered to the model's own maximum).
max_tokens = 16384

# The models we typically use, with what each is good for. Suggestions, not a whitelist; an entry
# can also override `max_tokens`, `input` (e.g. ["text", "image"]) or `thinking` for its model.
[[models.model]]
id = "deepseek/deepseek-v4.1-flash"
note = "Default: reliable tool use at very low cost."

[[models.model]]
id = "qwen/qwen3.8-flash"
note = "Cheapest: classification, short summaries. Weaker at multi-step tool use."

[[models.model]]
id = "~anthropic/claude-sonnet-latest"
note = "Expensive and strong: hard reasoning, long multi-step work, images."

[defaults]
idle_timeout = "15m"
job_timeout = "10m"
# How long a spawned agent or the reviewer may take to answer before whoever waits on it is told
# (`reply.overdue`); a proposal whose reviewer is overdue goes to you for approval.
reply_within = "20m"

[defaults.budget]
usd_per_day = 1.0

# Instance-wide settings. Protected: changes need the user's approval.
version = 1
# IANA time zone for schedules, agents' clocks and containers. Default: the host's.
# timezone = "Europe/Berlin"

[models]
default = "standard"

# Agents name a route, never a model. Routes carry their own token cap and privacy class.
# Defaults are deliberately cheap; an agent opts into `smart` by setting `model = "smart"`.

# Reliable tool use at very low cost (verified with pi tool calls).
[models.routes.standard]
provider = "openrouter"
model = "deepseek/deepseek-v4.1-flash"
api_key_secret = "OPENROUTER_API_KEY"
max_tokens = 16384

# Cheapest: classification, short summaries. Weaker at multi-step tool use.
[models.routes.fast]
provider = "openrouter"
model = "qwen/qwen3.8-flash"
api_key_secret = "OPENROUTER_API_KEY"
max_tokens = 8192

# Expensive; only for agents that name it. Sees images (attachments, `read` of a picture):
# routes only get images when `input` includes "image".
[models.routes.smart]
provider = "openrouter"
model = "anthropic/claude-sonnet-latest"
api_key_secret = "OPENROUTER_API_KEY"
max_tokens = 16384
input = ["text", "image"]

[defaults]
idle_timeout = "15m"
job_timeout = "10m"
# How long a spawned agent or the reviewer may take to answer before whoever waits on it is told
# (`reply.overdue`); a proposal whose reviewer is overdue goes to you for approval.
reply_within = "20m"

[defaults.budget]
usd_per_day = 1.0

# Push blocking requests to your phone with ntfy (https://ntfy.sh or self-hosted). The topic is a
# secret (declare it in secrets.toml, e.g. a hub-class group); the push text is fixed, never what
# an agent wrote.
# [push]
# ntfy_url = "https://ntfy.sh"
# topic_secret = "NTFY_TOPIC"

version = 1
description = "The agents' browser: Playwright MCP driving a real desktop Chromium (not headless) with ads and trackers blocked. Each chat's MCP connection gets its own isolated browser context (cookies, storage, tabs), closed after 10 idle minutes. A chat gets its tools with request_access(\"service:browser\"). Skill `browser`."
lifetime = "service"
# browser-session starts Xvfb and Chromium (images/browser), then execs the supervisor, which runs
# Playwright MCP as its child, smoke-tests the MCP endpoint and watches the browser. --isolated: a
# fresh in-memory context per MCP session, so chats never see each other's cookies or tabs.
# --allowed-hosts: only callers addressing the service by name; a page in this Chromium calling
# localhost is refused.
command = [
  "browser-session", "python3", "/app/supervise.py",
  "playwright-mcp",
  "--cdp-endpoint", "http://127.0.0.1:9223", "--isolated", "--idle-timeout", "600000",
  "--port", "8000", "--host", "0.0.0.0", "--allowed-hosts", "browser:8000",
  "--output-dir", "/tmp/playwright-mcp",
]
port = 8000
serves_mcp = true

# The supervisor checks CDP and calls botler.health.ok() every minute; a dead child or browser makes
# it call health.fail and exit, so the hub restarts the service and opens an incident.
[health]
heartbeat = "3m"
grace = "2m"

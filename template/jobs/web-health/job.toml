version = 1
description = "Daily live check that web.search and web.fetch still work. A failure goes to triage, which fixes tools/web/."
command = ["/app/.venv/bin/python", "-m", "web_health"]
timeout = "5m"
# No on_failure: failures open an incident for the `triage` agent.

[[trigger]]
name = "daily"
cron = "23 6 * * *"

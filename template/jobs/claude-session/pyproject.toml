[project]
name = "claude-session"
version = "0.1.0"
description = "Runs a Claude Code session for a claude_session.requested event and reports back."
requires-python = ">=3.11"
dependencies = ["shared", "pydantic>=2.6"]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

version = 1
description = "Runs a live Claude Code session on the user's subscription (`claude -p`, streaming, no permission prompts: the container is the boundary) for claude_session.requested events: it takes messages while it works, reports every turn to the requesting chat, and stays loaded 30 minutes after the last. GitHub over SSH (`github-ssh`) or a token (`github`). Skill `claude-code`."
command = ["/app/.venv/bin/python", "-m", "claude_session"]
# Turns plus 30 idle minutes after each; a run stops Claude 10 minutes before this to still report,
# and the next message resumes the session in a new run.
timeout = "4h"
# CLAUDE_CODE_OAUTH_TOKEN, from `claude setup-token` (skill `claude-code`). For private GitHub
# repos add "github-ssh" (an SSH key) and/or "github" (GITHUB_TOKEN, for pushes and PRs over HTTPS)
# once the user has entered it: a group that is declared here but has no value stops the job from
# starting.
secrets = ["claude-code"]
# Claude Code's home (~/.claude, its sessions) and every session's working directory, so `resume`
# continues where the last run stopped.
volume = true
emits = ["claude_session.finished"]
# No on_failure: a run that cannot report (no token entered, hub unreachable) opens an incident for
# `triage`. Claude's own failures (login expired, usage limit) are messaged to the chat instead.

[[trigger]]
name = "requested"
on = "claude_session.requested"
# Several sessions may run at once; a run for a session that is already live hands its message to
# that run and exits.
overlap = "allow"

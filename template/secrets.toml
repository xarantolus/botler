# Secret declarations, in groups. Values are entered by the user (web app: Secrets) and never
# live in git. Agents and jobs are granted whole groups: `secrets = ["openrouter"]`.
#   class = "container": delivered into containers that are granted the group, each secret as an
#                        env var named after it, or as a file when `file` is set.
#   class = "hub":       never enters a container; only approval-gated actions use it.
# Secret names are unique across all groups.
version = 1

[[group]]
name = "openrouter"
description = "OpenRouter account used by the model routes in botler.toml."
class = "container"

[[group.secret]]
name = "OPENROUTER_API_KEY"
description = "API key (https://openrouter.ai/keys)."

[[group]]
name = "claude-code"
description = "Claude Code on your Claude subscription (Pro, Max, Team or Enterprise), for jobs/claude-session."
class = "container"

[[group.secret]]
name = "CLAUDE_CODE_OAUTH_TOKEN"
description = "On a computer with Claude Code installed, run `claude setup-token`, approve in the browser, and paste the token it prints (valid for one year). It only makes model requests on your subscription."

[[group]]
name = "github"
description = "GitHub for Claude Code sessions (jobs/claude-session): clone private repos over HTTPS, push, open PRs. Not granted until a proposal adds it to the job's `secrets` (skill `claude-code`)."
class = "container"

[[group.secret]]
name = "GITHUB_TOKEN"
description = "A fine-grained personal access token (github.com > Settings > Developer settings > Fine-grained tokens), limited to the repositories Claude may work on, with Contents and Pull requests: read and write."

[[group]]
name = "github-ssh"
description = "SSH access to GitHub, so Claude Code sessions (and other repo work) can clone and push private repositories. Not granted until a proposal adds it to a job's `secrets` (skill `claude-code`)."
class = "container"

[[group.secret]]
name = "GITHUB_SSH_PRIVATE_KEY"
description = "Private key for github.com, delivered as a file. Generate one with `ssh-keygen -t ed25519 -C botler-github -f ~/.ssh/botler_github` (or reuse an existing key), add the matching `.pub` to GitHub → Settings → SSH and GPG keys, then paste the private key file's contents."
file = "/home/agent/.ssh/id_ed25519"

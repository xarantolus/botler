# Secret declarations. Values are entered by the user in the web app and never live in git.
#   class = "container": delivered into containers that are granted it (env var, or `file`).
#   class = "hub":       never enters a container; only approval-gated actions use it.
version = 1

[[secret]]
name = "OPENROUTER_API_KEY"
description = "OpenRouter key used by the model routes in botler.toml."
class = "container"

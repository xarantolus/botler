[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
botler-core = { path = "crates/botler-core" }
botler-store = { path = "crates/botler-store" }
botler-repo = { path = "crates/botler-repo" }
botler-runtime = { path = "crates/botler-runtime" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
schemars = { version = "1", features = ["chrono04", "uuid1"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
croner = "4"
humantime = "2"
uuid = { version = "1", features = ["v7", "serde"] }
globset = "0.4"
sha2 = "0.10"
hex = "0.4"
jsonschema = { version = "0.60", default-features = false }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
# TypeScript bindings for the web app, generated from the API types (see frontend/README.md).
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "chrono-impl", "uuid-impl", "no-serde-warnings"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

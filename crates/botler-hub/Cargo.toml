[package]
name = "botler"
description = "The botler hub: one binary that runs, schedules and supervises everything."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "botler"
path = "src/main.rs"

[lib]
name = "botler_hub"
path = "src/lib.rs"

[dependencies]
botler-core.workspace = true
botler-store.workspace = true
botler-repo.workspace = true
botler-runtime.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
uuid.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
sha2.workspace = true
hex.workspace = true
hmac = "0.12"
rand = "0.9"
base64 = "0.22"
schemars.workspace = true
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = "0.5"
http = "1"
rmcp = { version = "3.8", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
tokio-util = "0.7"
futures = "0.3"
include_dir = "0.7"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

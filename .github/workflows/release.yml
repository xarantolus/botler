name: Release

# Push a tag `v<version>` to build the `botler` binary for x86_64 and aarch64 Linux and attach it
# to a GitHub release. The web app, pi extension and Python SDK are compiled into it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # The oldest supported runners, so the binaries run on older glibc too.
          - { runner: ubuntu-22.04, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cargo build --release --locked -p botler
      - run: |
          out="botler-${GITHUB_REF_NAME}-${{ matrix.arch }}-linux"
          cp target/release/botler "$out"
          sha256sum "$out" > "$out.sha256"
          echo "OUT=$out" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}
          path: ${{ env.OUT }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes botler-*
